[package]
name = "vlab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local command-line application for virtual software laboratories staffed by AI agents"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
ctrlc = "3.5.2"
directories = "6.0.0"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
shell-words = "1.1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
terminal_size = "0.4.4"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
unicode-width = "0.2.3"
uuid = { version = "1.29.2", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
portable-pty = "0.9.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

# RUSTSEC-2026-0459: sqlx 0.9.0 caps libsqlite3-sys at <0.38.0, but the
# advisory is fixed only in 0.39.0 (SQLite 3.54.0). The published sqlx-sqlite
# 0.9.0 source is vendored with that single requirement widened; see
# vendor/README.md and ADR-0017. Remove when sqlx releases the same bound.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
