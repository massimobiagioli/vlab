# VLab preset agent catalog (ADR-0052).
#
# All people below are fictional. Their names mix German, Dutch, English,
# Japanese, Greek, and Slavic football-name traditions of the 1960s–1980s,
# including female names, without referring to any real player. Roles use the
# supported values: lead, dev, analyst, qa.
#
# Load the catalog into the local database with `make load-preset`, then use
# the Laboratories dashboard (`o`) to populate a laboratory.
version: 1
